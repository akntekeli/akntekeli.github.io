<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plaka">
<meta name="theme-color" content="#1d3f9e">
<title>Plaka Öğren</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebf0;--card:#fff;--ink:#14181f;--mute:#5d6674;--line:#cfd5de;--plate:#fbfbf6;--blue:#1d3f9e;--ok:#1f8a4c;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202a;--ink:#eef1f5;--mute:#9aa5b4;--line:#2b3644}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 'Barlow',system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:18px 0 40px}
h1{font:700 30px/1 'Barlow Condensed','Arial Narrow',sans-serif;margin:0 0 14px;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 0 14px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.tabs button{border:0;background:var(--card);padding:10px;font-weight:600}
.tabs button[aria-pressed=true]{background:var(--blue);color:#fff}
.prog{margin:2px 0 18px;font-size:15px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.stage{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:26px 16px;text-align:center;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.stage.tap{cursor:pointer}
.plate{display:inline-flex;align-items:stretch;background:var(--plate);color:#111;border:3px solid #111;border-radius:10px;overflow:hidden;font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;line-height:1}
.eu{background:var(--blue);color:#fff;width:.72em;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.08em}
.eu span{font-size:.3em}
.num{padding:.1em .28em .08em;letter-spacing:.03em;white-space:nowrap}
.rest{font-size:.6em;opacity:.2;margin-left:.3em}
.big{font-size:68px}.mini{font-size:30px}
.city{font:700 46px/1.05 'Barlow Condensed','Arial Narrow',sans-serif}
.hint{color:var(--mute);font-size:15px;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px 8px;font-weight:600;min-height:62px;display:flex;align-items:center;justify-content:center}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.acts{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:600;background:var(--blue);color:#fff}
.btn.ok{background:var(--ok)}.btn.no{background:var(--bad)}
.msg{margin:14px 0 0;font-weight:600;min-height:1.4em}
.foot{margin-top:26px;display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.link{background:none;border:0;text-decoration:underline;color:var(--mute);padding:0;font-size:14px}
@media (max-width:380px){.big{font-size:56px}.city{font-size:38px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const CITIES="Adana,Adıyaman,Afyonkarahisar,Ağrı,Amasya,Ankara,Antalya,Artvin,Aydın,Balıkesir,Bilecik,Bingöl,Bitlis,Bolu,Burdur,Bursa,Çanakkale,Çankırı,Çorum,Denizli,Diyarbakır,Edirne,Elazığ,Erzincan,Erzurum,Eskişehir,Gaziantep,Giresun,Gümüşhane,Hakkâri,Hatay,Isparta,Mersin,İstanbul,İzmir,Kars,Kastamonu,Kayseri,Kırklareli,Kırşehir,Kocaeli,Konya,Kütahya,Malatya,Manisa,Kahramanmaraş,Mardin,Muğla,Muş,Nevşehir,Niğde,Ordu,Rize,Sakarya,Samsun,Siirt,Sinop,Sivas,Tekirdağ,Tokat,Trabzon,Tunceli,Şanlıurfa,Uşak,Van,Yozgat,Zonguldak,Aksaray,Bayburt,Karaman,Kırıkkale,Batman,Şırnak,Bartın,Ardahan,Iğdır,Yalova,Karabük,Kilis,Osmaniye,Düzce".split(",");
let mode="card",dir="c2t",cur=null,deck=[],done=0,prev=0,sess={c:0,t:0};
const pad=n=>String(n).padStart(2,"0");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQ(code){
  if(mode==="quiz"){
    const o=[code];
    while(o.length<4){const r=1+Math.floor(Math.random()*81);if(!o.includes(r))o.push(r)}
    cur={code,opts:shuffle(o),ans:null};
  }else cur={code,shown:false};
}
function newQ(){
  if(!deck.length){
    deck=shuffle(Array.from({length:81},(_,i)=>i+1));done=0;
    if(deck[deck.length-1]===prev)deck.unshift(deck.pop());
  }
  prev=deck.pop();done++;
  makeQ(prev);
}
const plate=(c,cls,rest)=>`<span class="plate ${cls}" aria-label="Plaka ${pad(c)}"><span class="eu"><span>TR</span></span><span class="num">${pad(c)}${rest?'<span class="rest">ABC 123</span>':''}</span></span>`;
const cityEl=c=>`<div class="city">${CITIES[c-1]}</div>`;
function render(){
  const pct=Math.round(done/81*100);
  let h=`<h1>Plaka Öğren</h1>
  <div class="tabs" role="group" aria-label="Mod"><button data-a="mode" data-v="card" aria-pressed="${mode==="card"}">Kart</button><button data-a="mode" data-v="quiz" aria-pressed="${mode==="quiz"}">Test</button></div>
  <div class="row" role="group" aria-label="Yön"><button class="chip" data-a="dir" data-v="c2t" aria-pressed="${dir==="c2t"}">Plaka → İl</button><button class="chip" data-a="dir" data-v="t2c" aria-pressed="${dir==="t2c"}">İl → Plaka</button></div>
  <div class="prog">Bu tur: ${done} / 81<div class="bar"><i style="width:${pct}%"></i></div></div>`;
  const q=cur,front=dir==="c2t"?plate(q.code,"big",1):cityEl(q.code),back=dir==="c2t"?cityEl(q.code):plate(q.code,"big",1);
  if(mode==="card"){
    h+=`<div class="stage tap" data-a="flip" role="button" tabindex="0" aria-label="Kartı çevir">${q.shown?back:front}<p class="hint">${q.shown?"":"Cevap için dokun"}</p></div>`;
    h+=q.shown?`<div class="acts"><button class="btn no" data-a="again">Bilemedim</button><button class="btn ok" data-a="know">Bildim</button></div>`:`<div class="acts"><button class="btn" data-a="flip">Cevabı göster</button></div>`;
  }else{
    h+=`<div class="stage">${front}</div><div class="opts">`;
    for(const o of q.opts){
      let cl="opt";
      if(q.ans!==null){if(o===q.code)cl+=" ok";else if(o===q.ans)cl+=" no"}
      h+=`<button class="${cl}" data-a="ans" data-v="${o}">${dir==="c2t"?CITIES[o-1]:plate(o,"mini",0)}</button>`;
    }
    h+=`</div><p class="msg" aria-live="polite">${q.ans===null?"":q.ans===q.code?"Doğru.":"Doğru cevap: "+pad(q.code)+" "+CITIES[q.code-1]}</p>`;
    if(q.ans!==null)h+=`<div class="acts"><button class="btn" data-a="next">Sonraki</button></div>`;
  }
  h+=`<div class="foot"><span>Doğru: ${sess.c} / ${sess.t}</span><button class="link" data-a="reset">Baştan başla</button></div>`;
  app.innerHTML=h;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==="mode"){mode=v;sess={c:0,t:0};makeQ(cur.code)}
  else if(a==="dir"){dir=v;makeQ(cur.code)}
  else if(a==="flip"){cur.shown=!cur.shown}
  else if(a==="know"){sess.t++;sess.c++;newQ()}
  else if(a==="again"){sess.t++;newQ()}
  else if(a==="ans"){if(cur.ans!==null)return;cur.ans=Number(v);sess.t++;if(cur.ans===cur.code)sess.c++}
  else if(a==="next"){newQ()}
  else if(a==="reset"){if(!confirm("Baştan başlansın mı?"))return;deck=[];sess={c:0,t:0};newQ()}
  render();
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.a==="flip"){e.preventDefault();e.target.click()}});
const app=document.getElementById("app");
newQ();render();
</script>
</body>
</html>
